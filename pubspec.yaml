name: capstone
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
    
  # UI & Image
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  image: ^4.0.17
  cached_network_image: ^3.3.1
  # AI Detection - Versi GitHub yang fix
  tflite_flutter:
    git:
      url: https://github.com/tensorflow/flutter-tflite.git
      ref: main
  shared_preferences: ^2.5.4
  google_sign_in: ^6.2.1
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  socket_io_client: ^2.0.3+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_temantukang.png
    - assets/images/panduankiri.jpeg
    - assets/images/google.png
    - assets/images/panduankanan.jpeg
    - assets/images/mengenali_kerusakan.jpg
    - assets/images/tips_renovasi.jpg
    - assets/models/labels.txt
    - assets/models/best.tflite